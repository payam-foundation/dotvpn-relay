# Restricted-country hop. Init once, then either enroll (curated) or register (community).
# enroll/register default to https://ctrl.dotvpn.org; pass -control for a lab core.
#   docker compose run --rm dotvpn-relay init -config /data/config.yaml -decoy host.docker.internal:8443
#   # curated (control URL not stored):
#   docker compose run --rm -T dotvpn-relay enroll -config /data/config.yaml -token -
#   # community (stores control_url for beats; add -no-beat to the service command to opt out):
#   docker compose run --rm dotvpn-relay register -config /data/config.yaml -sni cdn.example.com -port 443
#   docker compose up -d
# The relay writes no access log; keep the Docker log driver on "none" or "local" with a small cap.
services:
  dotvpn-relay:
    image: ghcr.io/payam-foundation/dotvpn-relay:${DOTVPN_VERSION:?set DOTVPN_VERSION to a release tag}
    command: ["run", "-config", "/data/config.yaml"]
    restart: unless-stopped
    ports:
      - "443:443/tcp"
      # Publish UDP/53 only when dns_listen/dns_zone are set in config.yaml.
      # - "53:53/udp"
    volumes:
      - relay:/data
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    ulimits:
      nofile: 1048576
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    logging:
      driver: local
      options: {max-size: 1m, max-file: "2"}
    healthcheck:
      test: ["CMD", "/usr/local/bin/dotvpn-relay", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  relay:
