name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WIRE_MODULE: github.com/payam-foundation/dotvpn-wire

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Compatibility matrix: the wire version this repo pins, and wire main.
      matrix:
        wire: [pinned, main]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # The matrix proves the repo against its pinned wire tag and against wire main.
      - name: resolve wire main
        if: matrix.wire == 'main'
        run: go get $WIRE_MODULE@main && go mod tidy
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: fuzz smoke
        run: |
          for pkg in $(go list ./...); do
            for f in $(go test -list 'Fuzz.*' "$pkg" | grep '^Fuzz' || true); do
              go test -run '^$' -fuzz "^$f\$" -fuzztime 20s "$pkg"
            done
          done

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -severity=high -exclude=G115,G404 -exclude-generated ./...
      - name: gitleaks
        run: |
          v=8.30.1
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner -v .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - env:
          CGO_ENABLED: "0"
        run: |
          export GOOS=${{ matrix.target }}; GOOS=${GOOS%/*}
          export GOARCH=${{ matrix.target }}; GOARCH=${GOARCH#*/}
          go vet ./...
          go build -trimpath -o /dev/null ./cmd/dotvpn-relay

  # ADR-016: the neutral build must compile, pass the tests, and carry no
  # project name. garble is built with go.mod's Go (it refuses a newer one).
  neutral:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: garble
        run: GOTOOLCHAIN=local go install mvdan.cc/garble@v0.18.0
      - env:
          CGO_ENABLED: "0"
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          garble -literals -tiny test -count=1 ./...
          garble -literals -tiny build -trimpath -buildvcs=false -ldflags "-s -w" -o "$RUNNER_TEMP/neutral" ./cmd/dotvpn-relay
          if strings -a "$RUNNER_TEMP/neutral" | grep -i -E 'dotvpn|payam'; then echo "project name in neutral binary" >&2; exit 1; fi
          if go version -m "$RUNNER_TEMP/neutral" 2>&1 | grep -q 'path'; then echo "build info present" >&2; exit 1; fi

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: shellcheck deploy/install.sh deploy/garble-build.sh

  release:
    needs: [test, security, cross, neutral, shellcheck]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: garble
        run: GOTOOLCHAIN=local go install mvdan.cc/garble@v0.18.0
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image
        # Tags are the release version only; there is deliberately no "latest".
        run: |
          # Binary archives leave the built files in per-target dirs; stage the
          # exact release binaries under the names the Dockerfile copies.
          for a in amd64 arm64; do cp dist/dotvpn-relay_linux_${a}*/dotvpn-relay dist/dotvpn-relay_linux_${a}; done
          docker buildx build -f deploy/docker/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --sbom=true --provenance=true \
            --tag ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME} \
            --push .
      - name: sign image
        run: cosign sign --yes ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          severity: HIGH,CRITICAL
          exit-code: "1"

  # Runs the censorship lab (dotvpn-lab) against this PR. Needs a fine-grained
  # token with actions:write on dotvpn-lab in the LAB_DISPATCH_TOKEN secret;
  # without it the job is a no-op. The lab run is not linked back to this PR's
  # status: read it in the dotvpn-lab Actions tab.
  lab:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.LAB_DISPATCH_TOKEN }}
          REF: ${{ github.event.pull_request.head.sha }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "LAB_DISPATCH_TOKEN not set; skipping lab"; exit 0; }
          gh workflow run lab -R payam-foundation/dotvpn-lab -f relay_ref="$REF"
