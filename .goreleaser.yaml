version: 2

project_name: dotvpn-relay

before:
  hooks:
    - go mod verify

builds:
  - id: dotvpn-relay
    main: ./cmd/dotvpn-relay
    binary: dotvpn-relay
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux]
    goarch: [amd64, arm64]

  # Neutral build (ADR-016): same source, built with garble so the binary holds
  # no project name, module path, dependency list or wire constant. Used by
  # deploy/install.sh --lowkey. Needs garble on PATH (see ci.yml).
  - id: neutral
    main: ./cmd/dotvpn-relay
    binary: dotvpn-relay-neutral
    gobinary: ./deploy/garble-build.sh
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux]
    goarch: [amd64, arm64]

# Raw binaries named dotvpn-relay_<os>_<arch>: install scripts and the Dockerfile
# fetch exactly these and check them against checksums.txt.
archives:
  - ids: [dotvpn-relay]
    formats: [binary]
    name_template: "dotvpn-relay_{{ .Os }}_{{ .Arch }}"
  - ids: [neutral]
    formats: [binary]
    name_template: "dotvpn-relay-neutral_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per binary.
sboms:
  - artifacts: binary
    documents: ["{{ .Binary }}_{{ .Os }}_{{ .Arch }}.spdx.json"]
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]

# Keyless signing through the workflow's OIDC identity: no key to store.
# Verify: cosign verify-blob --bundle checksums.txt.sigstore.json \
#   --certificate-identity-regexp 'https://github.com/payam-foundation/dotvpn-relay/' \
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    args: ["sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    signature: "${artifact}.sigstore.json"

changelog:
  disable: true

release:
  draft: false
